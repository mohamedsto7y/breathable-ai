<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: linear-gradient(115deg, #f1fbf6 0%, #d3eee1 55%, #c3e6d6 100%); }
  .frame { flex-direction: row; justify-content: space-between; padding: 0 90px; text-align: left; }
  .left { max-width: 790px; }
  .left .row { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .left .row img { width: 66px; height: 66px; border-radius: 15px;
                   box-shadow: 0 8px 22px rgba(12,58,44,.2); }
  .left .row .name { font-size: 34px; font-weight: 700; letter-spacing: -.9px; }
  .left h1 { font-size: 42px; line-height: 1.18; }
  .left p { margin-top: 18px; font-size: 20px; color: #47705f; line-height: 1.5; }
  .composer { width: 470px; padding: 18px 18px 18px 24px; }
  .composer .text { font-size: 22px; }
</style></head><body>
<div class="frame">
  <div class="left">
    <div class="row"><img src="icon128.png"><div class="name">Breathable AI</div></div>
    <p class="kicker">Make AI human again!</p>
    <h1>The prompt tells the model to relax.<br><span class="dim">This one is for you.</span></h1>
    <p>A real human breath, every time you send the famous phrase.</p>
  </div>
  <div class="composer">
    <div class="text">take a deep breath<span class="caret"></span></div>
    <div class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>
</div></body></html>
