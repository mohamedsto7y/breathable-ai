<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: linear-gradient(135deg, #eefaf4 0%, #d6efe3 100%); }
  .frame { padding: 34px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .row img { width: 74px; height: 74px; border-radius: 17px;
             box-shadow: 0 8px 20px rgba(12,58,44,.18); }
  .row .name { font-size: 36px; font-weight: 700; letter-spacing: -1px; text-align: left; }
  .slogan { margin-top: 26px; font-size: 25px; font-weight: 800; letter-spacing: 1.2px;
            text-transform: uppercase; color: #1d9e75; line-height: 1.2; }
  .tag { margin-top: 12px; font-size: 16px; color: #5a8272; font-weight: 500; }
</style></head><body>
<div class="frame">
  <div class="row"><img src="icon128.png"><div class="name">Breathable AI</div></div>
  <p class="slogan">Make AI<br>human again!</p>
  <p class="tag">Type it. Then actually take one.</p>
</div></body></html>
