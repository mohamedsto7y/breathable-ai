<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .popup { width: 440px; background: #fff; border-radius: 20px; padding: 32px;
    text-align: center; box-shadow: 0 26px 64px rgba(12,58,44,.18);
    border: 1px solid rgba(20,90,70,.09); }
  .popup h2 { font-size: 30px; font-weight: 600; margin-bottom: 6px; letter-spacing: -.5px; }
  .popup .slogan { font-size: 14px; font-weight: 800; letter-spacing: 2.4px;
                   text-transform: uppercase; color: #1d9e75; margin-bottom: 24px; }
  .popup .btn { width: 100%; padding: 20px; border-radius: 16px; font-size: 28px;
    font-weight: 700; color: #fff; background: linear-gradient(#24ac80, #17855f); }
  .popup p { margin-top: 20px; font-size: 19px; color: #6b8a7d; line-height: 1.45; }
</style></head><body>
<div class="frame">
  <h1>The entire settings page.</h1>
  <p class="sub">On by default. One click to mute it in a meeting. There is nothing else to configure, because there is nothing else.</p>
  <div style="height:56px"></div>
  <div class="popup">
    <h2>Breathable AI</h2>
    <p class="slogan">Make AI human again!</p>
    <div class="btn">On</div>
    <p>Type &ldquo;take a deep breath&rdquo; in an AI chat and press Enter.</p>
  </div>
</div>
<div class="brand"><img src="icon128.png"><span>Breathable AI</span></div>
</body></html>
