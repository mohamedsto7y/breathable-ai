<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .ripple { margin-top: 46px; display: flex; align-items: center; gap: 14px; }
  .wave { display: flex; align-items: center; gap: 5px; height: 44px; }
  .wave i { display: block; width: 5px; border-radius: 3px; background: #1d9e75; opacity: .85; }
  .caption { font-size: 18px; color: #47705f; font-weight: 500; }
</style></head><body>
<div class="frame">
  <p class="kicker">Make AI human again!</p>
  <h1>The prompt tells the model to relax.<br><span class="dim">This one is for you.</span></h1>
  <p class="sub">Type the famous phrase into any AI chat. When you hit Enter, you hear a real human breath — and you take one too.</p>
  <div style="height:52px"></div>
  <div class="composer">
    <div class="text">take a deep breath<span class="caret"></span></div>
    <div class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>
  <div class="ripple">
    <div class="wave" id="w"></div>
    <div class="caption">five seconds of real human lungs</div>
  </div>
</div>
<div class="brand"><img src="icon128.png"><span>Breathable AI</span></div>
<script>
  const h=[8,15,26,38,44,40,31,22,30,41,44,36,25,17,11,7];
  document.getElementById('w').innerHTML=h.map(v=>`<i style="height:${v}px"></i>`).join('');
</script>
</body></html>
